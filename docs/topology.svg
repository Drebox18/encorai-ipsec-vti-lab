<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
<title id="title">Isolated IKEv2 and IPsec VTI lab</title><desc id="desc">LAN A connects through router 1, an encrypted tunnel between the routers, router 2, and LAN B. Four nodes and three physical links, no external network.</desc>
<rect width="1280" height="600" rx="28" fill="#091222" /><text x="55" y="65" fill="#74d9ff" font-size="18" font-family="sans-serif" letter-spacing="3">ENCORAI · NETWORKING LAB</text>
<text x="55" y="119" fill="#f1f5fb" font-size="36" font-weight="700" font-family="sans-serif">Prove the traffic, not just the tunnel.</text>
<text x="55" y="157" fill="#a8bad1" font-size="19" font-family="sans-serif">IKEv2 authenticates the peers. IPsec protects traffic selected by the VTI routes.</text>
