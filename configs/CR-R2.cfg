! Original isolated teaching fixture. Public PSK; never use on a real network.
hostname CR-R2
no ip domain lookup
ip cef
crypto ikev2 proposal CR-PROPOSAL
 encryption aes-cbc-256
 integrity sha256
 prf sha256
 group 14
crypto ikev2 policy CR-POLICY
 proposal CR-PROPOSAL
crypto ikev2 keyring CR-KEYRING
 peer CR-PEER
  address 192.0.2.1
  identity fqdn cr-r1.example.test
  pre-shared-key local SYNTHETIC_F031_F034_LAB_ONLY_V1
  pre-shared-key remote SYNTHETIC_F031_F034_LAB_ONLY_V1
crypto ikev2 profile CR-IKEV2
 match identity remote fqdn cr-r1.example.test
 identity local fqdn cr-r2.example.test
 authentication remote pre-share
 authentication local pre-share
 keyring local CR-KEYRING
 lifetime 3600
crypto ipsec transform-set CR-TRANSFORM esp-aes 256 esp-sha256-hmac
 mode tunnel
crypto ipsec profile CR-IPSEC
 set transform-set CR-TRANSFORM
 set ikev2-profile CR-IKEV2
 set pfs group14
 set security-association lifetime seconds 3600
interface GigabitEthernet1
 description ORIGINAL_UNDERLAY
 ip address 192.0.2.2 255.255.255.252
 no shutdown
interface GigabitEthernet2
 description ORIGINAL_LAN
 ip address 10.31.20.1 255.255.255.0
 no shutdown
interface Tunnel31
 description ORIGINAL_IPSEC_VTI
 ip address 172.31.255.2 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 tunnel source GigabitEthernet1
 tunnel destination 192.0.2.1
 tunnel mode ipsec ipv4
 tunnel protection ipsec profile CR-IPSEC
 no shutdown
ip route 10.31.10.0 255.255.255.0 Tunnel31
line con 0
 exec-timeout 0 0
 logging synchronous
 no login
end
