{
  "lab": {
    "title": "EncorAI - Isolated IKEv2 IPsec VTI Showcase",
    "version": "0.3.0",
    "description": "Isolated four-node IKEv2/IPsec VTI learning lab with no external connections. Public demonstration PSK; never use on a real network.",
    "notes": "Learning goal: distinguish IKE negotiation from encrypted LAN-to-LAN forwarding. Import only as a new disposable lab. Configs preserve the historical source; this repackaged import has not been runtime-tested. Follow README.md and docs/VERIFY.md."
  },
  "nodes": [
    {
      "id": "n0",
      "label": "LAN-A",
      "x": -375,
      "y": 0,
      "node_definition": "alpine",
      "image_definition": "alpine-base-3-20-3",
      "ram": 512,
      "cpus": 1,
      "cpu_limit": 100,
      "configuration": [
        {
          "name": "node.cfg",
          "content": "#!/bin/sh\n# Original endpoint. Configuration is sourced at boot in isolated CML.\nhostname LAN-A\nip link set eth0 up\nip address flush dev eth0\nip address add 10.31.10.10/24 dev eth0\nip route replace default via 10.31.10.1\n"
        }
      ],
      "interfaces": [
        {
          "id": "i0",
          "label": "eth0",
          "slot": 0,
          "type": "physical"
        }
      ]
    },
    {
      "id": "n1",
      "label": "CR-R1",
      "x": -125,
      "y": 0,
      "node_definition": "csr1000v",
      "image_definition": "csr1000v-17-03-08a",
      "ram": 3072,
      "cpus": 1,
      "cpu_limit": 100,
      "configuration": [
        {
          "name": "iosxe_config.txt",
          "content": "! Original isolated teaching fixture. Public PSK; never use on a real network.\nhostname CR-R1\nno ip domain lookup\nip cef\ncrypto ikev2 proposal CR-PROPOSAL\n encryption aes-cbc-256\n integrity sha256\n prf sha256\n group 14\ncrypto ikev2 policy CR-POLICY\n proposal CR-PROPOSAL\ncrypto ikev2 keyring CR-KEYRING\n peer CR-PEER\n  address 192.0.2.2\n  identity fqdn cr-r2.example.test\n  pre-shared-key local SYNTHETIC_F031_F034_LAB_ONLY_V1\n  pre-shared-key remote SYNTHETIC_F031_F034_LAB_ONLY_V1\ncrypto ikev2 profile CR-IKEV2\n match identity remote fqdn cr-r2.example.test\n identity local fqdn cr-r1.example.test\n authentication remote pre-share\n authentication local pre-share\n keyring local CR-KEYRING\n lifetime 3600\ncrypto ipsec transform-set CR-TRANSFORM esp-aes 256 esp-sha256-hmac\n mode tunnel\ncrypto ipsec profile CR-IPSEC\n set transform-set CR-TRANSFORM\n set ikev2-profile CR-IKEV2\n set pfs group14\n set security-association lifetime seconds 3600\ninterface GigabitEthernet1\n description ORIGINAL_UNDERLAY\n ip address 192.0.2.1 255.255.255.252\n no shutdown\ninterface GigabitEthernet2\n description ORIGINAL_LAN\n ip address 10.31.10.1 255.255.255.0\n no shutdown\ninterface Tunnel31\n description ORIGINAL_IPSEC_VTI\n ip address 172.31.255.1 255.255.255.252\n ip mtu 1400\n ip tcp adjust-mss 1360\n tunnel source GigabitEthernet1\n tunnel destination 192.0.2.2\n tunnel mode ipsec ipv4\n tunnel protection ipsec profile CR-IPSEC\n no shutdown\nip route 10.31.20.0 255.255.255.0 Tunnel31\nline con 0\n exec-timeout 0 0\n logging synchronous\n no login\nend\n"
        }
      ],
      "interfaces": [
        {
          "id": "i0",
          "label": "GigabitEthernet1",
          "slot": 0,
          "type": "physical"
        },
        {
          "id": "i1",
